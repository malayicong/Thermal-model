# ============================================================
#  EBM Thermal Modeling Tool — Simulation Configuration
#  Material: Dievar — typical EBM parameters
# ============================================================

simulation:
  name: EBM_Dievar_example
  mode: Solidification        # Snapshots | Solidification | T_history

# ------------------------------------------------------------
# Material properties
# All temperatures in Kelvin; conductivity in W/m/K;
# specific heat in J/kg/K; density in kg/m^3
# ------------------------------------------------------------
material:
  T_init: 1123.0              # K  preheat temperature (~750 C, typical EBM IN718)
  T_liq:  1760.0              # K  liquidus temperature of IN718
  k:      32                # W/m/K  thermal conductivity at ~1000 K
  cp:     695               # J/kg/K specific heat at ~1000 K
  rho:    7510             # kg/m^3 density

  # CET parameters for IN718 (optional — comment out if not needed)
  # cet:
  #   N0: 5.0e11
  #   n:  2.5
  #   a:  0.8e6

# ------------------------------------------------------------
# Electron beam parameters
# ------------------------------------------------------------
beam:
  power:      480             # W   beam power (lower than Ti64 due to higher density)
  efficiency: 0.75            # –   absorption efficiency (EBM in vacuum ~0.85-0.95)
  width_x:    250.0e-6        # m   beam half-width in x
  width_y:    250.0e-6        # m   beam half-width in y
  depth_z:    120.0e-6        # m   beam penetration depth

# ------------------------------------------------------------
# Scan path (embedded inline)
# Each row: [mode, x_mm, y_mm, z_mm, power_mod, param]
#   mode=1  spot dwell   | param = dwell time (s)
#   mode=0  line scan    | param = scan speed (m/s)
# ------------------------------------------------------------
path:
  - [1, -2,   0,   0, 0, 1.0e-4]   # park beam (power_mod=0)
  - [0, 2,   0,   0, 1, 0.1]      # scan line 1 ->
  # - [0, 4,   0.1, 0, 1, 3.5]      # step over
  # - [0, 0,   0.1, 0, 1, 3.5]      # scan line 2 <-
  # - [0, 0,   0.2, 0, 1, 3.5]      # step over
  # - [0, 4,   0.2, 0, 1, 3.5]      # scan line 3 ->
  # - [0, 4,   0.3, 0, 1, 3.5]      # step over
  # - [0, 0,   0.3, 0, 1, 3.5]      # scan line 4 <-
  - [1, 2,   0, 0, 0, 1.0e-4]   # beam off

# ------------------------------------------------------------
# Computational domain
# ------------------------------------------------------------
domain:
  x: [-5e-3,  5e-3]      # m
  y: [-5e-3,  5e-3]      # m
  z: [-2e-3,  0.0e-3]      # m   zmax=0 is the build surface
  resolution: 500.0e-6         # m

  geometry:
    type: null                # no geometry -- semi-infinite domain

# ------------------------------------------------------------
# Boundary conditions
# ------------------------------------------------------------
boundary_conditions:
  top_surface:
    type:       radiation
    emissivity: 0.65          #  surface emissivity
    T_env:      1123.0        # K   chamber/preheat temperature

  side_walls:
    type:       adiabatic

  bottom:
    type:       fixed_T
    value:      1123.0        # K

  reflections: 1

# ------------------------------------------------------------
# Mode-specific settings
# ------------------------------------------------------------
mode_settings:

  solidification:
    timestep:          5.0e-5   # s   finer step for faster scan speed
    tracking:          Volume
    output_frequency:  100
    secondary:         false
    sol_tolerance:     1.0e-3
    sol_max_iter:      10

  snapshots:
    times: [5.0e-4, 2.0e-3, 6.0e-3]

  t_history:
    timestep: 5.0e-5
    probe_points:
      - [0.002, 0.000, 0.0]
      - [0.00, 0.000, 0]

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  directory: Data
  fields:    [x, y, z, T, G, V, dTdt]
  vtk:       true

# ------------------------------------------------------------
# Compute settings
# ------------------------------------------------------------
compute:
  threads:      4
  compression:  true
  r_max:        -1.0
  t_hist:       1.0e-9
  p_hist:       1.0e-2
